name: Site PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  site:
    name: NAFS site checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://marketing.example
      NEXT_PUBLIC_APP_URL: https://app.nafs.tech
      NEXT_PUBLIC_ERP_URL: https://app.nafs.tech
      NEXT_PUBLIC_SIGN_IN_URL: https://app.nafs.tech/auth/sign-in
      NEXT_PUBLIC_CONTACT_EMAIL: hello@example.com
      NEXT_PUBLIC_INDEXABLE: '1'
      NEXT_PUBLIC_TRIAL_ENABLED: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Regression tests
        id: tests
        continue-on-error: true
        run: bun run test
      - name: Typecheck
        id: types
        continue-on-error: true
        run: bun run typecheck
      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint
      - name: Production build
        id: build
        continue-on-error: true
        run: bun run build
      - name: Require all phase gates
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          test "$TESTS" = success
          test "$TYPES" = success
          test "$LINT" = success
          test "$BUILD" = success
